<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Font Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #222222;
    --border: #2e2e2e; --border2: #3a3a3a;
    --text: #e8e6e1; --text2: #888; --text3: #555;
    --accent: #c8ff00; --accent-dim: rgba(200,255,0,0.12);
    --radius: 8px; --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }

  .app { display: grid; grid-template-columns: 312px 1fr; grid-template-rows: 48px 1fr; height: 100vh; min-height: 620px; }

  .header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .logo { font-family: var(--mono); font-size: 13px; letter-spacing: 0.15em; color: var(--accent); text-transform: uppercase; }

  .sidebar { border-right: 1px solid var(--border); background: var(--surface); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }

  .section-label { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text3); font-family: var(--mono); margin-bottom: 10px; }
  .hint { font-size: 10px; color: var(--text3); font-family: var(--mono); line-height: 1.5; margin-top: 8px; }

  /* Font dropdown */
  .fontsel { position: relative; }
  .fontsel-btn { width: 100%; text-align: left; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; color: var(--text); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; transition: border-color .12s; }
  .fontsel-btn:hover { border-color: var(--border2); }
  .fontsel-btn .caret { font-family: var(--mono); font-size: 10px; color: var(--text2); }
  .fontsel-menu { display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); z-index: 40; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-height: 320px; overflow-y: auto; }
  .fontsel.open .fontsel-menu { display: block; }
  .fontsel-item { padding: 10px 12px; font-size: 19px; color: var(--text); cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .fontsel-item:last-child { border-bottom: none; }
  .fontsel-item:hover { background: var(--accent-dim); }
  .fontsel-item .tag { font-family: var(--mono); font-size: 9px; color: var(--text3); letter-spacing: .1em; text-transform: uppercase; flex-shrink: 0; }
  .fontsel-item.active { color: var(--accent); }

  .upload-zone { border: 1px dashed var(--border2); border-radius: var(--radius); padding: 12px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; position: relative; margin-top: 8px; }
  .upload-zone:hover { border-color: var(--accent); background: var(--accent-dim); }
  .upload-zone.loading { border-color: #378ADD; background: rgba(55,138,221,.08); }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .upload-title { font-size: 12px; font-weight: 500; }
  .upload-sub { font-size: 10px; color: var(--text3); font-family: var(--mono); margin-top: 2px; }

  .control { display: flex; flex-direction: column; gap: 8px; }
  .control-row { display: flex; align-items: center; justify-content: space-between; }
  .control-name { font-size: 11px; color: var(--text2); }
  .control-val { font-family: var(--mono); font-size: 11px; color: var(--accent); }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 2px; background: var(--border2); border-radius: 2px; outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; transition: transform .1s; }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: var(--accent); cursor: pointer; }

  .align-btns { display: flex; gap: 4px; }
  .align-btn { flex: 1; padding: 7px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text2); font-size: 11px; font-family: var(--mono); cursor: pointer; text-align: center; transition: all .12s; }
  .align-btn:hover { border-color: var(--border2); color: var(--text); }
  .align-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

  /* Color control (swatch trigger) */
  .color-trigger { display: flex; gap: 8px; align-items: center; }
  .swatch { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--border2); cursor: pointer; flex-shrink: 0; position: relative; overflow: hidden; }
  .swatch .chk { position: absolute; inset: 0; background-color:#333; background-image: linear-gradient(45deg,#555 25%,transparent 25%),linear-gradient(-45deg,#555 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#555 75%),linear-gradient(-45deg,transparent 75%,#555 75%); background-size: 10px 10px; background-position: 0 0,0 5px,5px -5px,-5px 0; }
  .swatch .fill { position: absolute; inset: 0; }
  .swatch-label { flex: 1; font-family: var(--mono); font-size: 12px; color: var(--text2); }
  .swatch-label small { color: var(--text3); font-size: 10px; }

  .transp-toggle { margin-top: 10px; width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); font-family: var(--mono); font-size: 11px; cursor: pointer; letter-spacing: .05em; transition: all .12s; text-align: center; }
  .transp-toggle:hover { border-color: var(--border2); color: var(--text); }
  .transp-toggle.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  /* Popover */
  .popover { position: fixed; z-index: 200; width: 234px; background: var(--surface); border: 1px solid var(--border2); border-radius: 10px; padding: 14px; display: none; flex-direction: column; gap: 12px; box-shadow: 0 16px 44px rgba(0,0,0,.6); }
  .popover.open { display: flex; }
  .sv-area { position: relative; width: 206px; height: 140px; border-radius: 6px; cursor: crosshair; overflow: hidden; }
  .sv-thumb { position: absolute; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5); transform: translate(-50%,-50%); pointer-events: none; }
  .hue-area { position: relative; width: 206px; height: 14px; border-radius: 7px; cursor: pointer; background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%); }
  .hue-thumb { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5); background: transparent; transform: translate(-50%,-50%); pointer-events: none; }
  .pop-inputs { display: flex; gap: 6px; }
  .pop-hex { flex: 1.3; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 7px; font-family: var(--mono); font-size: 12px; color: var(--text); outline: none; min-width: 0; }
  .pop-hex:focus { border-color: var(--accent); }
  .rgb-group { display: flex; gap: 4px; flex: 2; }
  .rgb-in { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 4px; font-family: var(--mono); font-size: 12px; color: var(--text); outline: none; text-align: center; min-width: 0; -moz-appearance: textfield; }
  .rgb-in::-webkit-outer-spin-button, .rgb-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .rgb-in:focus { border-color: var(--accent); }
  .pop-row-label { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--text3); font-family: var(--mono); }
  .pop-actions { display: flex; gap: 6px; }
  .eyedrop-btn { flex: 1; padding: 7px; border-radius: 6px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-family: var(--mono); font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .12s; }
  .eyedrop-btn:hover { border-color: var(--accent); color: var(--accent); }
  .eyedrop-btn:disabled { opacity: .4; cursor: not-allowed; }
  .presets { display: flex; gap: 5px; flex-wrap: wrap; }
  .preset { width: 20px; height: 20px; border-radius: 5px; cursor: pointer; border: 1px solid var(--border2); position: relative; overflow: hidden; }
  .preset:hover { transform: scale(1.12); }
  .preset.transp { background-color:#333; background-image: linear-gradient(45deg,#555 25%,transparent 25%),linear-gradient(-45deg,#555 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#555 75%),linear-gradient(-45deg,transparent 75%,#555 75%); background-size: 8px 8px; background-position: 0 0,0 4px,4px -4px,-4px 0; }

  .canvas-area { display: flex; flex-direction: column; background: var(--bg); min-width: 0; }
  .canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px; overflow: auto; }
  .canvas-wrap.transp { background-color:#2a2a2a; background-image: linear-gradient(45deg,#3a3a3a 25%,transparent 25%),linear-gradient(-45deg,#3a3a3a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#3a3a3a 75%),linear-gradient(-45deg,transparent 75%,#3a3a3a 75%); background-size: 24px 24px; background-position: 0 0,0 12px,12px -12px,-12px 0; }
  .preview-text { outline: none; white-space: pre-wrap; word-break: break-word; max-width: 100%; caret-color: var(--accent); cursor: text; }
  .preview-text:empty::before { content: 'Type something…'; color: var(--text3); pointer-events: none; }

  .toolbar { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; justify-content: flex-end; background: var(--surface); }
  .btn { padding: 7px 18px; border-radius: var(--radius); border: 1px solid var(--border2); background: transparent; color: var(--text); font-size: 12px; font-family: var(--mono); cursor: pointer; letter-spacing: .05em; transition: all .12s; }
  .btn:hover { border-color: var(--text2); }
  .btn-accent { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 500; }
  .btn-accent:hover { background: #d4ff1a; border-color: #d4ff1a; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 300; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; padding: 24px; width: 560px; max-width: 92vw; display: flex; flex-direction: column; gap: 16px; }
  .modal-title { font-size: 14px; font-weight: 500; font-family: var(--mono); letter-spacing: .05em; }
  .modal-sub { font-size: 12px; color: var(--text2); line-height: 1.6; }
  .modal-preview { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; min-height: 90px; max-height: 300px; display: flex; align-items: center; justify-content: center; background-color:#2a2a2a; background-image: linear-gradient(45deg,#3a3a3a 25%,transparent 25%),linear-gradient(-45deg,#3a3a3a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#3a3a3a 75%),linear-gradient(-45deg,transparent 75%,#3a3a3a 75%); background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0; }
  .modal-preview svg, .modal-preview img { max-width: 100%; max-height: 300px; display: block; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  a.dl-link { display: inline-block; padding: 7px 18px; border-radius: var(--radius); font-size: 12px; font-family: var(--mono); cursor: pointer; letter-spacing: .05em; text-decoration: none; text-align: center; transition: all .12s; background: var(--accent); color: #000; border: 1px solid var(--accent); font-weight: 500; }
  a.dl-link:hover { background: #d4ff1a; }
  a.dl-link[disabled] { opacity: .4; pointer-events: none; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
  .divider { height: 1px; background: var(--border); margin: 0 -16px; }
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <span class="logo">Font Studio</span>
    <span id="status-msg" style="font-size:11px;font-family:var(--mono);color:var(--text3);"></span>
  </header>

  <aside class="sidebar">
    <div>
      <div class="section-label">Font</div>
      <div class="fontsel" id="fontsel">
        <button class="fontsel-btn" id="fontsel-btn"><span id="fontsel-current">Loading…</span><span class="caret">▼</span></button>
        <div class="fontsel-menu" id="fontsel-menu"></div>
      </div>
      <div class="upload-zone" id="drop-zone">
        <input type="file" id="font-file" accept=".otf,.ttf">
        <div class="upload-title" id="upload-label">Upload your own font</div>
        <div class="upload-sub">.otf or .ttf</div>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">Typography</div>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="control">
          <div class="control-row"><span class="control-name">Size</span><span class="control-val" id="size-val">72px</span></div>
          <input type="range" id="font-size" min="8" max="400" value="72" step="1">
        </div>
        <div class="control">
          <div class="control-row"><span class="control-name">Letter spacing</span><span class="control-val" id="ls-val">0.00em</span></div>
          <input type="range" id="letter-spacing" min="-0.1" max="1" value="0" step="0.005">
        </div>
        <div class="control">
          <div class="control-row"><span class="control-name">Line height</span><span class="control-val" id="lh-val">1.15</span></div>
          <input type="range" id="line-height" min="0.6" max="3" value="1.15" step="0.05">
        </div>
      </div>
      <div class="hint">Select any letters or words first — changes apply to your selection. With nothing selected, they apply to everything.</div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">Alignment</div>
      <div class="align-btns">
        <button class="align-btn active" data-align="left">Left</button>
        <button class="align-btn" data-align="center">Center</button>
        <button class="align-btn" data-align="right">Right</button>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">Text color</div>
      <div id="text-color-mount"></div>
    </div>

    <div>
      <div class="section-label">Background</div>
      <div id="bg-color-mount"></div>
      <button class="transp-toggle" id="bg-transp">Transparent background</button>
    </div>
  </aside>

  <div class="canvas-area">
    <div class="canvas-wrap" id="canvas-wrap">
      <div class="preview-text" id="preview" contenteditable="true" spellcheck="false"
        style="font-size:72px;color:#e8e6e1;letter-spacing:0em;line-height:1.15;text-align:left;">hello world</div>
    </div>
    <div class="toolbar">
      <button class="btn" onclick="openExport('png')">Export PNG</button>
      <button class="btn btn-accent" onclick="openExport('svg')">Export SVG</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Export</div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="modal-preview" id="modal-preview"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <a class="dl-link" id="dl-btn" download>Download</a>
    </div>
  </div>
</div>

function b64ToBuf(dataUrl){
  const b64 = dataUrl.split(',')[1];
  const bin = atob(b64);
  const u = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return u.buffer;
}
function clamp(v,a,b){ return Math.min(b, Math.max(a,v)); }
function hsv2rgb(h,s,v){
  h=(h%360+360)%360; const i=Math.floor(h/60), f=h/60-i, p=v*(1-s), q=v*(1-f*s), t=v*(1-(1-f)*s);
  let r,g,b; switch(i%6){case 0:r=v,g=t,b=p;break;case 1:r=q,g=v,b=p;break;case 2:r=p,g=v,b=t;break;case 3:r=p,g=q,b=v;break;case 4:r=t,g=p,b=v;break;default:r=v,g=p,b=q;}
  return { r:Math.round(r*255), g:Math.round(g*255), b:Math.round(b*255) };
}
function rgb2hsv(r,g,b){
  r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; let h=0;
  if(d){ if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360; }
  return { h, s: mx?d/mx:0, v: mx };
}
function hex2rgb(hex){ hex=hex.replace('#',''); if(hex.length===3) hex=hex.split('').map(c=>c+c).join(''); const n=parseInt(hex,16); return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 }; }
function rgb2hex(r,g,b){ return '#'+[r,g,b].map(x=>clamp(Math.round(x),0,255).toString(16).padStart(2,'0')).join(''); }
function parseCssRgb(str){ const m=str.match(/(\d+(\.\d+)?)/g); if(!m) return {r:0,g:0,b:0}; return { r:+m[0], g:+m[1], b:+m[2] }; }

/* ============================================================
   FONT REGISTRATION  (bundled + uploaded share one path)
   ============================================================ */
async function registerFont(key, label, ab){
  const family = 'fs_' + key;
  try {
    const ff = new FontFace(family, ab.slice(0));
    await ff.load();
    document.fonts.add(ff);
  } catch(e){ console.warn('FontFace failed', key, e); }
  let ot = null;
  try { ot = opentype.parse(ab); } catch(e){ console.warn('opentype parse failed', key, e); }
  FONTS[key] = { label, family, ot };
  return key;
}

function buildFontMenu(){
  const menu = document.getElementById('fontsel-menu');
  menu.innerHTML = '';
  Object.keys(FONTS).forEach(key => {
    const f = FONTS[key];
    const item = document.createElement('div');
    item.className = 'fontsel-item' + (key===baseFontKey?' active':'');
    item.style.fontFamily = `'${f.family}'`;
    item.dataset.key = key;
    const tag = FONTS[key].uploaded ? 'yours' : 'bundled';
    item.innerHTML = `<span>${f.label}</span><span class="tag">${tag}</span>`;
    item.addEventListener('mousedown', e => { e.preventDefault(); }); // keep editor selection
    item.addEventListener('click', () => { chooseFont(key); closeFontMenu(); });
    menu.appendChild(item);
  });
}
function setFontButtonLabel(key){
  const el = document.getElementById('fontsel-current');
  el.textContent = FONTS[key] ? FONTS[key].label : '—';
  el.style.fontFamily = FONTS[key] ? `'${FONTS[key].family}'` : 'inherit';
}

}

function closeFontMenu(){ document.getElementById('fontsel').classList.remove('open'); }
document.getElementById('fontsel-btn').addEventListener('click', () => {

document.getElementById('font-file').addEventListener('change', async e => {

/* ============================================================
   SELECTION ENGINE  — per-letter / per-word styling
   ============================================================ */
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (sel.rangeCount && editor.contains(sel.anchorNode)) {
    const r = sel.getRangeAt(0);
    if (!r.collapsed) savedRange = r.cloneRange();
    else savedRange = null;              // caret in editor => global intent
    syncUIFromSelection();
  }
});

function getWorkingRange(){
  const sel = window.getSelection();
  if (sel.rangeCount){
    const r = sel.getRangeAt(0);
    if (editor.contains(r.commonAncestorContainer)){
      return r.collapsed ? null : r;     // selection => that range; caret => global
    }
  }
  // focus is outside the editor (a slider / picker) — fall back to last saved selection
  if (savedRange && !savedRange.collapsed && savedRange.startContainer.isConnected && editor.contains(savedRange.commonAncestorContainer)){
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(savedRange);
    return savedRange;
  }
  return null;
}

function selectedTextNodes(range){
  // split boundary text nodes so the range aligns to node edges
  const sc = range.startContainer, so = range.startOffset;
  if (sc.nodeType===3 && so>0 && so<sc.length){ const after = sc.splitText(so); range.setStart(after,0); }
  const ec = range.endContainer, eo = range.endOffset;
  if (ec.nodeType===3 && eo>0 && eo<ec.length){ ec.splitText(eo); }
  const rootNode = range.commonAncestorContainer.nodeType===3 ? range.commonAncestorContainer.parentNode : range.commonAncestorContainer;
  const walker = document.createTreeWalker(rootNode, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  let n;
  while ((n = walker.nextNode())){
    if (!n.textContent.length) continue;
    const nr = document.createRange(); nr.selectNodeContents(n);
    const startsBeforeSelEnd = range.compareBoundaryPoints(Range.START_TO_END, nr) > 0;
    const endsAfterSelStart  = range.compareBoundaryPoints(Range.END_TO_START, nr) < 0;
    if (startsBeforeSelEnd && endsAfterSelStart) nodes.push(n);
  }
  return nodes;
}

function wrapSelection(range){
  const nodes = selectedTextNodes(range);
  const spans = [];
  nodes.forEach(tn => {
    const p = tn.parentNode;
    let sp;
    if (p !== editor && p.nodeName==='SPAN' && p.classList.contains('r') && p.childNodes.length===1){
      sp = p;                            // reuse our own single-child wrapper
    } else {
      sp = document.createElement('span'); sp.className='r';
      p.insertBefore(sp, tn); sp.appendChild(tn);
    }
    spans.push(sp);
  });
  return spans;
}

function selectSpans(spans){
  if(!spans.length) return;
  const sel = window.getSelection();
  const r = document.createRange();
  r.setStart(spans[0], 0);
  const last = spans[spans.length-1];
  r.setEnd(last, last.childNodes.length);
  sel.removeAllRanges(); sel.addRange(r);
  savedRange = r.cloneRange();
}

/* discrete apply (font, color) */
function applyDiscrete(cssName, val, fontKey){
  const range = getWorkingRange();
  if (range){
    const spans = wrapSelection(range);
    spans.forEach(sp => {
      if (cssName) sp.style.setProperty(cssName, val);
      if (fontKey){ sp.dataset.font = fontKey; sp.style.fontFamily = `'${FONTS[fontKey].family}'`; }
    });
    selectSpans(spans);
  } else {
    editor.querySelectorAll('span').forEach(sp => {
      if (cssName) sp.style.removeProperty(cssName);
      if (fontKey){ delete sp.dataset.font; sp.style.removeProperty('font-family'); }
    });
    if (cssName) editor.style.setProperty(cssName, val);
    if (fontKey){ editor.dataset.font = fontKey; editor.style.fontFamily = `'${FONTS[fontKey].family}'`; baseFontKey = fontKey; }
  }
}

function chooseFont(key){
  if(!FONTS[key]) return;
  applyDiscrete('font-family', `'${FONTS[key].family}'`, key);
  setFontButtonLabel(baseFontKey);
  markActiveFontItem(baseFontKey);
  editor.focus();
}

/* slider session (size, spacing, line height) — avoids span build-up during drag */
let session = { active:false, cssName:null, global:false, spans:null };
let sessionTimer = null;
function sliderApply(cssName, val){
  if (!session.active || session.cssName !== cssName) beginSession(cssName);
  if (session.global){
    editor.querySelectorAll('span').forEach(sp => sp.style.removeProperty(cssName));
    editor.style.setProperty(cssName, val);
  } else {
    session.spans.forEach(sp => sp.style.setProperty(cssName, val));
  }
  clearTimeout(sessionTimer);
  sessionTimer = setTimeout(endSession, 500);
}
function beginSession(cssName){
  const range = getWorkingRange();
  session.active = true; session.cssName = cssName;
  if (range){ session.global=false; session.spans = wrapSelection(range); selectSpans(session.spans); }
  else { session.global=true; session.spans=null; }
}
function endSession(){ if(session.spans && session.spans.length) selectSpans(session.spans); session.active=false; }

/* ---------- sync sidebar from current selection ---------- */
function styleSourceEl(){
  const sel = window.getSelection();
  let node = null;
  if (sel.rangeCount && editor.contains(sel.anchorNode)) node = sel.anchorNode;
  else if (savedRange && editor.contains(savedRange.startContainer)) node = savedRange.startContainer;
  else node = editor;
  return node.nodeType===3 ? node.parentElement : node;
}
function resolveFontKey(el){
  let n = el;
  while (n && n !== editor.parentNode){
    if (n.dataset && n.dataset.font) return n.dataset.font;
    n = n.parentNode;
  }
  return baseFontKey;
}
let syncScheduled = false;
function syncUIFromSelection(){
  if (syncScheduled) return; syncScheduled = true;
  requestAnimationFrame(() => {
    syncScheduled = false;
    try {
      const el = styleSourceEl();
      const cs = getComputedStyle(el);
      const sizePx = parseFloat(cs.fontSize) || 72;
      sizeEl.value = clamp(sizePx, +sizeEl.min, +sizeEl.max);
      document.getElementById('size-val').textContent = Math.round(sizePx) + 'px';
      const lsPx = cs.letterSpacing==='normal' ? 0 : (parseFloat(cs.letterSpacing)||0);
      const lsEm = lsPx / sizePx;
      lsEl.value = clamp(lsEm, +lsEl.min, +lsEl.max);
      document.getElementById('ls-val').textContent = lsEm.toFixed(2) + 'em';
      let lh = cs.lineHeight==='normal' ? 1.2 : (parseFloat(cs.lineHeight)/sizePx);
      lhEl.value = clamp(lh, +lhEl.min, +lhEl.max);
      document.getElementById('lh-val').textContent = lh.toFixed(2);
      const c = parseCssRgb(cs.color);
      textColorCtl.setRGB(c.r, c.g, c.b, true);
      const fk = resolveFontKey(el);
      setFontButtonLabel(fk); markActiveFontItem(fk);
    } catch(e){ /* ignore */ }
  });
}

/* keep pastes plain-text */
editor.addEventListener('paste', e => {

/* ============================================================
   COLOR PICKER  (HSV square, hue, hex, RGB, eyedropper, presets)
   ============================================================ */
const PRESETS = ['#000000','#ffffff','#e8e6e1','#c8ff00','#ff3b30','#ff9500','#34c759','#0a84ff','#5e5ce6','#ff2d92','#8e8e93','#1D1F2E'];
const EYEDROP_OK = ('EyeDropper' in window);

function createColorPicker(mount, opts){
  opts = opts || {};
  const state = { h:0, s:0, v:0, transparent:false };

  /* trigger row */
  const row = document.createElement('div'); row.className='color-trigger';
  const sw = document.createElement('div'); sw.className='swatch';
  const chk = document.createElement('div'); chk.className='chk'; chk.style.display='none';
  const fill = document.createElement('div'); fill.className='fill';
  sw.appendChild(chk); sw.appendChild(fill);
  const lbl = document.createElement('div'); lbl.className='swatch-label';
  row.appendChild(sw); row.appendChild(lbl);
  mount.appendChild(row);

  /* popover (appended to body so sidebar overflow can't clip it) */
  const pop = document.createElement('div'); pop.className='popover';
  pop.innerHTML = `
    <div class="presets"></div>
    <div class="sv-area"><div class="sv-thumb"></div></div>
    <div class="hue-area"><div class="hue-thumb"></div></div>
    <div class="pop-inputs">
      <input class="pop-hex" spellcheck="false" maxlength="7" value="#000000">
      <div class="rgb-group">
        <input class="rgb-in ri-r" type="number" min="0" max="255">
        <input class="rgb-in ri-g" type="number" min="0" max="255">
        <input class="rgb-in ri-b" type="number" min="0" max="255">
      </div>
    </div>
    <div class="pop-actions">
      <button class="eyedrop-btn">${EYEDROP_OK ? '⛏ Eyedropper (whole screen)' : 'Eyedropper unsupported'}</button>
    </div>`;
  document.body.appendChild(pop);

  const svArea = pop.querySelector('.sv-area');
  const svThumb = pop.querySelector('.sv-thumb');
  const hueArea = pop.querySelector('.hue-area');
  const hueThumb = pop.querySelector('.hue-thumb');
  const hexIn = pop.querySelector('.pop-hex');
  const riR = pop.querySelector('.ri-r'), riG = pop.querySelector('.ri-g'), riB = pop.querySelector('.ri-b');
  const eyeBtn = pop.querySelector('.eyedrop-btn');
  eyeBtn.disabled = !EYEDROP_OK;

  /* presets */
  const presetWrap = pop.querySelector('.presets');
  (opts.presets || PRESETS).forEach(hx => {
    const p = document.createElement('div'); p.className='preset'; p.style.background = hx; p.title = hx;
    p.addEventListener('click', () => { state.transparent=false; const c=hex2rgb(hx); setFromRGB(c.r,c.g,c.b); emit(); });
    presetWrap.appendChild(p);
  });
  if (opts.allowTransparent){
    const t = document.createElement('div'); t.className='preset transp'; t.title='Transparent';
    t.addEventListener('click', () => { state.transparent=true; render(); emit(); });
    presetWrap.appendChild(t);
  }

  function currentRGB(){ return hsv2rgb(state.h, state.s, state.v); }
  function render(){
    const rgb = currentRGB();
    const hex = rgb2hex(rgb.r, rgb.g, rgb.b);
    if (state.transparent){
      chk.style.display='block'; fill.style.display='none';
      lbl.innerHTML = 'Transparent';
    } else {
      chk.style.display='none'; fill.style.display='block'; fill.style.background = hex;
      lbl.innerHTML = hex.toUpperCase() + `<br><small>rgb(${rgb.r}, ${rgb.g}, ${rgb.b})</small>`;
    }
    svArea.style.background = `linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent), hsl(${state.h},100%,50%)`;
    svThumb.style.left = (state.s*100)+'%';
    svThumb.style.top  = ((1-state.v)*100)+'%';
    hueThumb.style.left = (state.h/360*100)+'%';
    hexIn.value = hex; riR.value = rgb.r; riG.value = rgb.g; riB.value = rgb.b;
  }
  function emit(){ if(opts.onChange) opts.onChange(state.transparent ? null : currentRGB()); }

  function setFromRGB(r,g,b){ const c=rgb2hsv(r,g,b); state.h=c.h; state.s=c.s; state.v=c.v; state.transparent=false; render(); }

  /* SV drag */
  function svFromEvent(e){
    const rect = svArea.getBoundingClientRect();
    const x = clamp((e.clientX-rect.left)/rect.width, 0, 1);
    const y = clamp((e.clientY-rect.top)/rect.height, 0, 1);
    state.s = x; state.v = 1-y; state.transparent=false; render(); emit();
  }
  bindDrag(svArea, svFromEvent);
  /* hue drag */
  function hueFromEvent(e){
    const rect = hueArea.getBoundingClientRect();
    const x = clamp((e.clientX-rect.left)/rect.width, 0, 1);
    state.h = x*360; state.transparent=false; render(); emit();
  }
  bindDrag(hueArea, hueFromEvent);

  hexIn.addEventListener('input', () => {
    let v = hexIn.value.trim(); if(v[0]!=='#') v='#'+v;
    if (/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v)){ const c=hex2rgb(v); setFromRGB(c.r,c.g,c.b); emit(); }
  });
  [riR,riG,riB].forEach(inp => inp.addEventListener('input', () => {
    const r=clamp(+riR.value||0,0,255), g=clamp(+riG.value||0,0,255), b=clamp(+riB.value||0,0,255);
    setFromRGB(r,g,b); emit();
  }));

  eyeBtn.addEventListener('click', async () => {
    if(!EYEDROP_OK) return;
    try { const ed = new EyeDropper(); const res = await ed.open(); const c=hex2rgb(res.sRGBHex); setFromRGB(c.r,c.g,c.b); emit(); }
    catch(e){ /* user cancelled */ }
  });

  /* open / close */
  function openPop(){
    const r = sw.getBoundingClientRect();
    pop.style.left = Math.min(r.left, window.innerWidth - 250) + 'px';
    let top = r.bottom + 8;
    pop.classList.add('open');
    const ph = pop.getBoundingClientRect().height;
    if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 8);
    pop.style.top = top + 'px';
  }
  function closePop(){ pop.classList.remove('open'); }
  sw.addEventListener('click', e => { e.stopPropagation(); if(pop.classList.contains('open')) closePop(); else openPop(); });
  document.addEventListener('click', e => { if(!pop.contains(e.target) && e.target!==sw && !sw.contains(e.target)) closePop(); });

  /* public */
  const api = {
    setRGB(r,g,b,silent){ setFromRGB(r,g,b); if(!silent) emit(); },
    setTransparent(){ state.transparent=true; render(); emit(); },
    getRGB(){ return state.transparent ? null : currentRGB(); },
  };
  render();
  return api;
}

/* generic pointer drag binding */
function bindDrag(el, handler){
  let dragging=false;
  const move = e => { if(dragging){ e.preventDefault(); handler(e.touches?e.touches[0]:e); } };
  const up = () => { dragging=false; };
  el.addEventListener('mousedown', e => { dragging=true; handler(e); });
  el.addEventListener('touchstart', e => { dragging=true; handler(e.touches[0]); }, {passive:true});
  window.addEventListener('mousemove', move);
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('mouseup', up);
  window.addEventListener('touchend', up);
}

/* instantiate the two pickers */
const textColorCtl = createColorPicker(document.getElementById('text-color-mount'), {
  onChange: rgb => { if(rgb) applyDiscrete('color', `rgb(${rgb.r},${rgb.g},${rgb.b})`); }

const bgColorCtl = createColorPicker(document.getElementById('bg-color-mount'), {

  onChange: rgb => {

/* ============================================================
   EXPORT  — walk styled DOM -> per-glyph vector paths (SVG)
   ============================================================ */
function collectStyledChars(){
  const chars = [];
  const csCache = new Map();
  function csOf(el){ let c=csCache.get(el); if(!c){ c=getComputedStyle(el); csCache.set(el,c);} return c; }
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, null);
  let n;
  while ((n = walker.nextNode())){
    const el = n.parentElement; if(!el) continue;
    const cs = csOf(el);
    const size = parseFloat(cs.fontSize) || 72;
    const lsPx = cs.letterSpacing==='normal' ? 0 : (parseFloat(cs.letterSpacing)||0);
    const lhPx = cs.lineHeight==='normal' ? size*1.2 : (parseFloat(cs.lineHeight)||size*1.2);
    const rgb  = parseCssRgb(cs.color);
    const color = rgb2hex(rgb.r,rgb.g,rgb.b);
    const fontKey = resolveFontKey(el);
    const text = n.textContent.replace(/\u00a0/g,' ');
    for (const ch of text) chars.push({ ch, size, lsPx, lhPx, color, fontKey });
  }
  return chars;
}

function buildLines(){
  const plainRaw = (editor.innerText || '').replace(/\u00a0/g,' ').replace(/\r/g,'');
  let plain = plainRaw.replace(/\n$/,'');           // drop one trailing newline contenteditable adds
  const styled = collectStyledChars();
  const lines = [[]]; let p = 0;
  for (const ch of plain){
    if (ch === '\n'){ lines.push([]); continue; }
    const s = styled[p++] || { ch, size:72, lsPx:0, lhPx:86, color:'#000000', fontKey:baseFontKey };
    lines[lines.length-1].push(Object.assign({}, s, { ch }));
  }
  return lines;
}

function otFor(key){
  if (FONTS[key] && FONTS[key].ot) return FONTS[key].ot;
  if (FONTS[baseFontKey] && FONTS[baseFontKey].ot) return FONTS[baseFontKey].ot;
  const any = Object.values(FONTS).find(f=>f.ot); return any ? any.ot : null;
}

function buildVectorSVG(){
  const lines = buildLines();
  const baseSize = parseFloat(getComputedStyle(editor).fontSize) || 72;
  const baseLhPx = (parseFloat(getComputedStyle(editor).lineHeight) || baseSize*1.15);

  // measure each line: width, ascent, descent, box height
  const measured = lines.map(line => {
    if (!line.length){
      const asc = FONTS[baseFontKey]?.ot ? FONTS[baseFontKey].ot.ascender*(baseSize/FONTS[baseFontKey].ot.unitsPerEm) : baseSize*0.8;
      const dsc = FONTS[baseFontKey]?.ot ? -FONTS[baseFontKey].ot.descender*(baseSize/FONTS[baseFontKey].ot.unitsPerEm) : baseSize*0.2;
      return { width:0, ascent:asc, descent:dsc, box:baseLhPx, glyphs:[] };
    }
    let width=0, ascent=0, descent=0, box=0;
    const glyphs=[];
    line.forEach(c => {
      const ot = otFor(c.fontKey);
      let adv = c.size*0.5;
      if (ot){
        const scale = c.size/ot.unitsPerEm;
        const g = ot.charToGlyph(c.ch);
        adv = (g.advanceWidth||0)*scale;
        ascent  = Math.max(ascent,  ot.ascender*scale);
        descent = Math.max(descent, -ot.descender*scale);
      } else {
        ascent = Math.max(ascent, c.size*0.8); descent = Math.max(descent, c.size*0.2);
      }
      box = Math.max(box, c.lhPx);
      glyphs.push({ c, adv });
      width += adv + c.lsPx;
    });
    return { width, ascent, descent, box, glyphs };
  });

  const maxSize = Math.max(baseSize, ...lines.flat().map(c=>c.size||0), 1);
  const pad = clamp(maxSize*0.4, 40, 240);
  const maxWidth = Math.max(1, ...measured.map(m=>m.width));

  // layout Y (CSS line-box model: leading split around glyph)
  let cursorY = pad;
  const placed = [];
  measured.forEach(m => {
    const extra = m.box - (m.ascent + m.descent);
    const baseline = cursorY + Math.max(0, extra)/2 + m.ascent;
    let startX;
    if (textAlign==='center')      startX = pad + (maxWidth - m.width)/2;
    else if (textAlign==='right')  startX = pad + (maxWidth - m.width);
    else                           startX = pad;
    let x = startX;
    m.glyphs.forEach(g => {
      placed.push({ c:g.c, x, baseline });
      x += g.adv + g.c.lsPx;
    });
    cursorY += m.box;
  });

  const svgW = Math.ceil(maxWidth + pad*2);
  const svgH = Math.ceil(cursorY + pad);

  // group glyphs by color to keep the file compact
  const byColor = new Map();
  placed.forEach(pl => {
    const ot = otFor(pl.c.fontKey); if(!ot) return;
    const path = ot.getPath(pl.x, pl.baseline, pl.c.size);
    const d = path.toPathData(3);
    if (!d || !d.trim()) return;
    if (!byColor.has(pl.c.color)) byColor.set(pl.c.color, []);
    byColor.get(pl.c.color).push(d);
  });

  const parts = [];
  parts.push('<?xml version="1.0" encoding="UTF-8"?>');
  parts.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}">`);
  if (currentBg) parts.push(`  <rect width="${svgW}" height="${svgH}" fill="${currentBg}"/>`);
  byColor.forEach((ds, color) => {
    parts.push(`  <path fill="${color}" d="${ds.join(' ')}"/>`);
  });
  parts.push('</svg>');
  return { svg: parts.join('\n'), width: svgW, height: svgH };
}

/* ---------- export modal ---------- */
async function openExport(type){
  const modal = document.getElementById('modal');
  const previewEl = document.getElementById('modal-preview');
  const dlBtn = document.getElementById('dl-btn');
  const titleEl = document.getElementById('modal-title');
  const subEl = document.getElementById('modal-sub');

  previewEl.innerHTML=''; subEl.textContent='Rendering…'; dlBtn.setAttribute('disabled','');
  modal.classList.add('open');
  await new Promise(r=>setTimeout(r,30));

  if (!Object.values(FONTS).some(f=>f.ot)){
    subEl.textContent = 'No vector font data available yet. Try re-selecting a bundled font.'; return;
  }
  const text = (editor.innerText||'').trim();
  if (!text){ subEl.textContent='Type some text first.'; return; }

  const { svg, width, height } = buildVectorSVG();

  if (type==='svg'){
    const wrap = document.createElement('div');
    wrap.style.cssText='max-width:100%;max-height:300px;display:flex;align-items:center;justify-content:center;';
    wrap.innerHTML = svg;
    const s = wrap.querySelector('svg'); if(s){ s.style.maxWidth='100%'; s.style.maxHeight='300px'; }
    previewEl.appendChild(wrap);
    titleEl.textContent = 'Export SVG — Vector';
    subEl.textContent = `${width} × ${height}px — pure vector paths (no font embedding). Infinitely scalable; opens in Figma, Illustrator, Inkscape.` + (currentBg?'' : ' Background is transparent.');
    const blob = new Blob([svg], { type:'image/svg+xml' });
    dlBtn.href = URL.createObjectURL(blob);
    dlBtn.download = 'font-studio.svg';
    dlBtn.textContent = 'Download SVG';
    dlBtn.removeAttribute('disabled');
  } else {
    // rasterize the SAME vector SVG for a pixel-perfect PNG
    const scale = 3;
    const img = new Image();
    const blob = new Blob([svg], { type:'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = width*scale; canvas.height = height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      const pngUrl = canvas.toDataURL('image/png');
      const pimg = document.createElement('img'); pimg.src=pngUrl; pimg.style.cssText='max-width:100%;max-height:300px;display:block;';
      previewEl.appendChild(pimg);
      titleEl.textContent = 'Export PNG';
      subEl.textContent = `${width*scale} × ${height*scale}px — ${scale}× raster.` + (currentBg?'' : ' Transparent background.');
      dlBtn.href = pngUrl; dlBtn.download='font-studio.png'; dlBtn.textContent='Download PNG'; dlBtn.removeAttribute('disabled');
    };
    img.onerror = () => { subEl.textContent='PNG render failed.'; URL.revokeObjectURL(url); };
    img.src = url;
  }
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => { if(e.target===document.getElementById('modal')) closeModal(); });

/* ============================================================
   BOOT
   ============================================================ */
(async function boot(){
  status('Loading fonts…');
  for (const b of BUNDLED){
    try { await registerFont(b.key, b.label, b64ToBuf(FONT_DATA[b.key])); }
    catch(e){ console.error('bundle load failed', b.key, e); }
  }
  baseFontKey = BUNDLED[0].key;
  buildFontMenu();
  // apply default font globally + default text color
  editor.dataset.font = baseFontKey;
  editor.style.fontFamily = `'${FONTS[baseFontKey].family}'`;
  setFontButtonLabel(baseFontKey);
  markActiveFontItem(baseFontKey);
  textColorCtl.setRGB(0xe8, 0xe6, 0xe1, true);
  canvasWrap.style.background = currentBg;
  status('Ready');
  editor.focus();
})();
